summary:
  types:
  - http
  - openIdConnect
  http_schemes:
  - bearer
  bearer_formats:
  - JWT
  identity_provider: Auth0 (ethernovia.us.auth0.com)
  anonymous_access: false
  note: >-
    Every data endpoint on the Customer Portal API is bearer-JWT protected and returns
    HTTP 403 ForbiddenError anonymously (verified 2026-08-04). Interactive sign-in is
    federated to the company's Auth0 tenant; the Strapi users-permissions plugin also
    exposes local email/password auth endpoints (/auth/local, /auth/local/register).
