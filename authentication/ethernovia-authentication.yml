local_auth_operations:
- POST /auth/local
- POST /auth/local/register
- POST /auth/forgot-password
- POST /auth/reset-password
- POST /auth/change-password
- GET /auth/{provider}/callback
- GET /connect/{provider}
gated_developer_surface:
  note: >-
    Ethernovia's product-facing software — tools, software binaries, source-code drivers,
    header files and plug-in APIs, plus their documentation — is not reachable anonymously.
