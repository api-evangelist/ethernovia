aid: ethernovia
name: Ethernovia
description: 'Ethernovia is a San Jose, California semiconductor company building deterministic
  Ethernet networking silicon for software-defined vehicles, robotics and physical AI. Its
  portfolio spans single-pair (T1) Ethernet PHYs from 1G to 10G (ENT11100, ENT11025, ENT14100,
  ENT14025), deterministic packet processors and switches, and the High-Speed Sensor Bridge
  platform that bridges GMSL 2/3 cameras and CAN FD/XL onto 10GBASE-T1 Ethernet for NVIDIA
  Holoscan, Orin and Thor compute. Ethernovia publishes no public product API: its software
  binaries, source-code drivers, header files and plug-in APIs are distributed to customers
  under NDA and a separate EULA through the Ethernovia Customer Portal. The one machine-readable
  contract reachable without credentials is the Customer Portal''s own backend API, whose
  Swagger UI is served publicly at portal-admin.ethernovia.com/documentation.'
image: https://www.ethernovia.com/wp-content/uploads/2026/02/ethernovia-physical-ai-networking-chips.jpg
