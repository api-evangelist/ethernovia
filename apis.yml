apis:
- name: Ethernovia Customer Portal API
  description: 'REST API behind the Ethernovia Customer Portal (portal.ethernovia.com), built
    on Strapi 5. Exposes the portal content model — products, product families and categories,
    document and software-package catalogs, download history, customer groups, statuses and
    user audit trails — plus the Strapi users-permissions auth and upload plugins. All data
    endpoints require a bearer JWT and return 403 anonymously; the OpenAPI document itself is
    served publicly by the Strapi documentation plugin at /documentation.'
  humanURL: https://portal-admin.ethernovia.com/documentation
  baseURL: https://portal-admin.ethernovia.com/api
  tags:
  - Customer Portal
  - Documents
  - Software Downloads
  - Product Catalog
  - Strapi
  x-notes: 'The OpenAPI is auto-generated by the Strapi documentation plugin (info.title
    "DOCUMENTATION", servers[0] a localhost:1337 placeholder) and appears to be a default
    plugin surface rather than a deliberately published developer API. Data endpoints are
    correctly auth-gated (403 anonymous, verified 2026-08-04). Confirm with Ethernovia before
    publishing this entry.'
